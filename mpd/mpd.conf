music_directory "/home/j1n/Music"
playlist_directory "/home/j1n/.mpd/playlists"
db_file "/home/j1n/.mpd/mpd.db"
log_file "/home/j1n/.mpd/mpd.log"
pid_file "/home/j1n/.mpd/mpd.pid"
state_file "/home/j1n/.mpd/mpdstate"
audio_output {
  type          "pulse"
  name          "Master"
  mixer_device  "default"
  mixer_control "PulseAudio"
  mixer_index   "0"
  auto_resample "no"
}

audio_output {
  type   "fifo"
  name   "fifo: ncmpcpp visualizer"
  path   "/tmp/mpd.fifo"
  format "44100:16:2"
}

bind_to_address "127.0.0.1"
port "6600"
