# herdr configuration — see `herdr --default-config` for the full annotated template.
# Only deliberate overrides live here; everything else stays on herdr's defaults.
#
# Installed by `setup.ps1 -Module herdr` / `setup.sh -m herdr` as a symlink to
# ~/.config/herdr/config.toml (herdr uses ~/.config on Windows too, not %APPDATA%).
# Only this file is linked — the rest of that directory is herdr runtime state
# (session.json, sockets, logs) and must not be tracked.
#
# Validate with `herdr config check`; apply to a running server with
# `herdr server reload-config`.

# Skip the first-run onboarding flow.
onboarding = false

[terminal]
# Resolved from PATH. Herdr otherwise falls back to $SHELL, then /bin/sh.
default_shell = "pwsh"

[experimental]
# Keep per-pane scrollback history across sessions.
pane_history = true

[keys]
# Cycle focus between active agent panes. Bracket keys are unused by any other
# default Herdr binding (see herdr --default-config), so this pair is collision-free
# within Herdr's own prefix namespace. See herdr/README.md for the rationale.
previous_agent = "prefix+["
next_agent = "prefix+]"

# Bare-fzf agent picker (issue #169). "a" is unbound in herdr --default-config's
# full [keys] table. Runs the picker via $env:DOTFILES so it resolves against the
# stable clone regardless of machine; %DOTFILES% is a persistent User env var set
# by setup.ps1. Windows-only — see herdr/README.md.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = 'pwsh -NoProfile -File "%DOTFILES%\herdr\agent-picker.ps1"'
width = "80%"
height = "80%"

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false
