name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        run: |
          # windows-latest ships PSScriptAnalyzer preinstalled; skip the PSGallery round-trip
          # (NuGet provider bootstrap + download) when the image already has it.
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          Get-Module -ListAvailable PSScriptAnalyzer | Select-Object Name, Version

      - name: PSScriptAnalyzer (whole tree, repo settings)
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          # Vendored third-party code is out of scope per AGENTS.md (psmux/plugins/ is
          # upstream code pinned by SHA, and the azure-prepare skill is Microsoft's MIT
          # payload), not ours to lint - do not gate on it.
          $legacy = '[\\/](psmux[\\/]plugins|ai-agents[\\/]skills[\\/]azure-prepare)[\\/]'
          $gated = $results | Where-Object { $_.ScriptPath -notmatch $legacy }
          $vendored = @($results).Count - @($gated).Count
          Write-Host "PSScriptAnalyzer: $(@($results).Count) result(s), $vendored in vendored paths (not gated)."
          if ($gated) {
            $gated | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer found $($gated.Count) issue(s)."
          }
          Write-Host "PSScriptAnalyzer: clean."

  # Pester is split across parallel jobs on each OS. The suite is dominated by per-test child
  # processes (pwsh, git, bash, node), which are slow to start, on Windows above all. The
  # shard lists live in .github/scripts/Invoke-PesterShard.ps1; its last shard runs every
  # file not listed, and it fails if its shard count does not match the matrix here.
  # Each job has a fixed name so that it can be a required check.
  pester-windows:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            name: Pester (Windows 1/4)
          - shard: 2
            name: Pester (Windows 2/4)
          - shard: 3
            name: Pester (Windows 3/4)
          - shard: 4
            name: Pester (Windows 4/4)
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        run: |
          # The runner images ship Pester >=5.5.0 preinstalled; skip the PSGallery round-trip
          # when the image already satisfies the requirement.
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Get-Module -ListAvailable Pester | Select-Object Name, Version

      # Neovim is not on the runner images, and tests/nvim-statusline.Tests.ps1 fails without
      # it. The pin matches the version the bars were developed on, because statusline and
      # vim.pack behaviour can change between releases.
      - uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: v0.12.6

      - name: Pester (tests/, shard ${{ matrix.shard }} of 4)
        run: ./.github/scripts/Invoke-PesterShard.ps1 -Platform Windows -Shard ${{ matrix.shard }} -Count 4

  # setup.ps1's Windows-only suites (e.g. the -Module all smoke) self-skip on Linux
  # (-Skip:(-not $IsWindows)) rather than failing, so these runs still need to exit 0.
  pester-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            name: Pester (Ubuntu 1/2)
          - shard: 2
            name: Pester (Ubuntu 2/2)
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        run: |
          # The runner images ship Pester >=5.5.0 preinstalled; skip the PSGallery round-trip
          # when the image already satisfies the requirement.
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Get-Module -ListAvailable Pester | Select-Object Name, Version

      # Same pinned Neovim as the Windows jobs (see the comment there).
      - uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: v0.12.6

      - name: Pester (tests/, shard ${{ matrix.shard }} of 2)
        run: ./.github/scripts/Invoke-PesterShard.ps1 -Platform Linux -Shard ${{ matrix.shard }} -Count 2

  smoke-linux:
    name: setup.sh + Neovim smoke (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same pinned Neovim as the Pester jobs.
      - uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: v0.12.6

      # Startup smoke test. It uses the Neovim installed above. The minimal
      # profile loads no plugins, so it needs no network. XDG dirs are isolated so nothing from
      # the runner leaks in, and the repo's nvim/ is symlinked in as the config. Any startup
      # error sets v:errmsg and fails the step.
      - name: Neovim minimal-profile startup smoke
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          mkdir -p "$scratch/config" "$scratch/data" "$scratch/state" "$scratch/cache"
          ln -s "$PWD/nvim" "$scratch/config/nvim"
          NVIM_PROFILE=minimal \
            XDG_CONFIG_HOME="$scratch/config" \
            XDG_DATA_HOME="$scratch/data" \
            XDG_STATE_HOME="$scratch/state" \
            XDG_CACHE_HOME="$scratch/cache" \
            nvim --headless \
              -c 'if v:errmsg != "" | echoerr v:errmsg | cquit 1 | endif' \
              -c 'qa'

      # setup.sh (the Linux/WSL installer) has no Pester coverage of its own beyond
      # tests/setup-sh.Tests.ps1, which runs in the Ubuntu Pester jobs. These two steps add a
      # real end-to-end smoke on top of that: a full -m all --dry-run, and a --clean-backups
      # detection pass.

      - name: setup.sh -m all --dry-run smoke
        shell: bash
        run: |
          set -euo pipefail
          scratch_home="$(mktemp -d)"
          # Invoked via `bash`, not `./setup.sh`: the file is tracked non-executable (100644)
          # in git, so a fresh checkout would hit "Permission denied" on a direct exec.
          # The runner sets XDG_CONFIG_HOME, which setup.sh prefers over $HOME/.config, so
          # point it into the scratch home too.
          HOME="$scratch_home" XDG_CONFIG_HOME="$scratch_home/.config" bash setup.sh -m all --dry-run
          echo "setup.sh -m all --dry-run: exit 0, no changes made to $scratch_home"

      - name: setup.sh --clean-backups smoke
        shell: bash
        run: |
          set -euo pipefail
          scratch_home="$(mktemp -d)"
          # Two backups of the same file, seeded a second apart, so --keep-backups 1 has a real
          # older/newer pair to prune between (matches the pattern in
          # tests/setup-sh.Tests.ps1's "finds and removes .bak.TIMESTAMP files in HOME").
          touch "$scratch_home/.gitconfig.bak.20200101_010101"
          sleep 1
          touch "$scratch_home/.gitconfig.bak.20200101_020202"
          out="$(HOME="$scratch_home" bash setup.sh --clean-backups --keep-backups 1)"
          echo "$out"
          echo "$out" | grep -q 'Removed (count)' || {
            echo "expected --clean-backups to detect and remove a seeded .bak file"
            exit 1
          }
          [ -f "$scratch_home/.gitconfig.bak.20200101_010101" ] && {
            echo "older backup should have been removed"
            exit 1
          }
          [ -f "$scratch_home/.gitconfig.bak.20200101_020202" ] || {
            echo "newer backup should have survived"
            exit 1
          }

  stylua:
    name: stylua --check (nvim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned (not "latest") so a future stylua release can't reformat and
          # red this now-required check without a deliberate bump + reformat.
          version: 2.5.2
          args: --check nvim/

  shellcheck:
    name: shellcheck (active shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # An explicit list, not a glob: most of the repo's shell is out of scope, so the
      # exclusions would outnumber the inclusions and read worse. Deliberately NOT covered
      # (each carries pre-existing findings in code that works - the same carve-out the
      # PSScriptAnalyzer job makes for legacy/vendored files):
      #   - the legacy Linux snapshot per AGENTS.md: scripts/, config/, nvim/install.sh
      #   - bash/*.sh: sourced fragments with no shebang, never executed as scripts
      #   - ai-agents/**/skills/**: vendored skill payloads, not ours to lint
      #   - git/templates/hooks/{ctags,post-*}: the upstream git-ctags recipe. Its SC1007 is
      #     a false positive (`CDPATH= cd --` is a valid env-var prefix, not a botched
      #     assignment), so gating on it would mean suppressing, not fixing.
      # Add new first-party shell files here - nothing else picks them up.
      - run: |
          shellcheck \
            setup.sh \
            claude/no-claude-session-trailer.sh \
            claude/statusline-command.sh \
            codex/ai-reference-guard.sh \
            codex/block-dangerous-git.sh \
            git/templates/hooks/commit-msg \
            git/templates/hooks/pre-commit \
            git/templates/hooks/prepare-commit-msg \
            git/templates/hooks/prepare-commit-msg.sh

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the scan covers every commit, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE needed: free for personal-account repositories.
