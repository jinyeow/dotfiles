# psmux config — installed as ~/.psmux.conf (psmux auto-loads it; it wins over ~/.tmux.conf).
# Managed by dotfiles/psmux/ — symlinked via `setup.ps1 -Module psmux`.
#
# Replaces the zellij setup: catppuccin theme, vi keys, auto-grid pane balancing,
# and unified Ctrl-hjkl navigation shared with nvim. Prefix stays the default Ctrl+b.

# --- Base -------------------------------------------------------------------
# NOTE: psmux does NOT strip trailing inline comments on `set` lines — it parses the
# comment as part of the value. Keep comments on their own line above the setting.
set -g mouse on
set -g mode-keys vi
# history-limit: parity with zellij scroll_buffer_size
set -g history-limit 10000
# set-clipboard: OSC52 → Windows Terminal clipboard
set -g set-clipboard on
# sensible defaults (inlined — the psmux-sensible plugin is not used)
set -g focus-events on
set -g escape-time 10

# --- Copy-on-select (drag-release copies to the system clipboard) -----------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# --- Equalize + auto-grid ---------------------------------------------------
# Native: Prefix+Alt+5 tiled (force-equalize), Prefix+Space cycle, Prefix+Alt+1..4 others.
# Auto-grid: every new pane rebalances to an even grid (2 panes = columns, 4 = 2x2, ...).
# Toggle the HOOK itself (set/unset) — psmux freezes an in-hook option condition at set time,
# so gating internally does not re-evaluate. State lives in @auto_grid for the toggle key.
# @auto_grid: flip to 'off' to default-disable (config toggle). No trailing comment (see NOTE above).
set -g @auto_grid on
if-shell -F '#{==:#{@auto_grid},on}' "set-hook -g after-split-window 'select-layout tiled'"
bind g if-shell -F '#{==:#{@auto_grid},on}' \
  "set -g @auto_grid off ; set-hook -gu after-split-window ; display-message 'auto-grid: OFF'" \
  "set -g @auto_grid on  ; set-hook -g after-split-window 'select-layout tiled' ; display-message 'auto-grid: ON'"

# --- Unified Ctrl-hjkl navigation (panes + nvim splits) ---------------------
# In an nvim pane, pass the key through to nvim (its keymaps.lua moves the split and hands
# back to psmux at the edge via `tmux select-pane`); elsewhere navigate psmux panes directly.
bind -n C-h if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'
# Ctrl-l is now navigation; recover clear-screen on Prefix+Ctrl-l.
bind C-l send-keys C-l

# --- Resize mode (zellij-style sticky: Prefix r, then hjkl; Esc/q exits) -----
bind r switch-client -T resize
bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize
bind -T resize = select-layout tiled \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize q      switch-client -T root

# (Move-mode dropped: auto-grid owns pane structure, so a sticky swap/rotate mode earned no keep.)

# --- Pane titles ------------------------------------------------------------
# Prefix+T sets a pane title (psmux has no rename-pane). NOT shown in the pane border:
# `pane-border-status top` consumes a row that psmux miscounts, misaligning the shell cursor.
bind T command-prompt -p 'pane title:' 'select-pane -T "%%"'

# --- fzf session switcher popup (overrides default choose-session on Prefix+s) ---
# Parses list-sessions' default output in pwsh (no #{} in the popup string, avoiding
# psmux format-expansion at bind time). Smoke-test on first use; comment out to fall
# back to the default `choose-session` if the popup misbehaves.
bind s display-popup -E -w 50% -h 50% "psmux list-sessions | %{ ($_ -split ':')[0] } | fzf --reverse --prompt 'switch> ' | %{ psmux switch-client -t $_ }"

# --- Theme: catppuccin mocha (inlined — no theme plugin) --------------------
# Palette matches nvim/yazi/zellij. status-left shows the focused pane's title once you set one
# (Prefix+T) — hidden while it is the default hostname. status-right shows the auto-grid state.
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left ' #[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] #[fg=#f9e2af]#{?#{==:#{pane_title},#{host_short}},,#{pane_title} }'
set -g status-left-length 60
set -g window-status-current-style 'bg=#313244,fg=#89b4fa,bold'
set -g window-status-style 'fg=#a6adc8'
set -g status-right '#[fg=#a6adc8]#{?#{==:#{@auto_grid},on},[grid] ,}%H:%M %d-%b '
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#585b70,fg=#cdd6f4'

# --- Persistence: vendored + SHA-pinned in psmux/plugins/, sourced directly (NO PPM) ---------
# resurrect + continuum each ship a `plugin.conf` (their "source-file compatible" static form:
# the C-s/C-r save/restore binds and continuum's auto-save/restore hooks) plus pre-generated
# scripts/. Sourcing these needs no PPM — no resolver, no `@plugin`, no network, no Prefix+I/U/M,
# closing the namespace-hijack path entirely. Copied to ~/.psmux/plugins/ by setup.ps1.
# (@continuum-save-interval is fixed at 15m inside continuum's plugin.conf; only @continuum-restore
# is read at runtime.) See psmux/plugins/README.md.
set -g @continuum-restore 'on'
# setup.ps1 copies the plugins alongside this config, so they are present at load. These lines are
# last, so even if a plugin were absent the only loss is persistence — everything above is loaded.
# (`-q` would suppress a missing-file error but breaks `~` expansion on psmux, so it is not used.)
source-file '~/.psmux/plugins/psmux-resurrect/plugin.conf'
source-file '~/.psmux/plugins/psmux-continuum/plugin.conf'
