# =============================================================================
# psmux-sidebar - Directory tree sidebar for psmux
# Static .conf version (source-file compatible)
# =============================================================================
# Key bindings:
#   Prefix + Tab   - Toggle sidebar (focus stays on original pane)
#   Prefix + BTab  - Toggle sidebar (focus moves to sidebar)

# Toggle sidebar
# run-shell runs the arg as PowerShell, so $env:USERPROFILE is expanded by the outer pwsh before
# the inner `pwsh -File` sees it. Do NOT use a literal ~ here: `pwsh -File` does not tilde-expand,
# so it would fail to find the script and the bind would silently no-op (psmux ~ handling is also
# unreliable — see psmux.conf). Forward slashes avoid conf-level backslash escaping.
bind-key Tab run-shell 'pwsh -NoProfile -File "$env:USERPROFILE/.psmux/plugins/psmux-sidebar/scripts/toggle_sidebar.ps1"'

# Toggle sidebar with focus
bind-key BTab run-shell 'pwsh -NoProfile -File "$env:USERPROFILE/.psmux/plugins/psmux-sidebar/scripts/toggle_sidebar.ps1" -FocusSidebar'
