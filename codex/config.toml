[agents.fixer]
description = "fix-findings: applies fixes for confirmed, introduced findings (write access)"
developer_instructions = """
Fix only the findings assigned in your task. Lint only the files you touched before
returning — the full test suite and full-tree lint run once, after all fixers return,
owned by the orchestrator; do not run them yourself. Never write to the findings store
yourself — return your result to the orchestrator, which is the store's sole writer.
"""
sandbox_mode = "workspace-write"
mcp_servers = []
