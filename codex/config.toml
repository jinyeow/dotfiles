# ~/.codex/config.toml — Codex CLI global config
# Installed by setup.ps1 -Module codex. Docs: https://developers.openai.com/codex/config-reference
#
# This is the STANDALONE posture (when you run `codex` directly): it can edit files in the
# workspace but asks before edits/commands. The read-only REVIEWER posture used when Claude
# Code calls Codex is set separately, as -c overrides on the MCP registration — see
# codex/README.md. Do not relax this to danger-full-access.

model = "gpt-5.6-sol"

# "minimal" | "low" | "medium" | "high"
model_reasoning_effort = "low"

# "untrusted" | "on-request" | "never"
approval_policy = "on-request"

# "read-only" | "workspace-write" | "danger-full-access"
sandbox_mode = "workspace-write"

# Personal coding conventions shared with Claude Code live in ~/.codex/AGENTS.md
# (sourced from dotfiles ai-agents/AGENTS.md). Cap the instruction chain generously so the
# full conventions file is always read.
project_doc_max_bytes = 32768

# Enable Codex's hook system. Two independent consumers share it:
# - herdr's agent-state integration reports session activity to a running herdr server.
#   `setup.ps1 -Module herdr` runs `herdr integration install codex`, which writes the hook
#   script + a SessionStart entry in ~/.codex/hooks.json.
# - The git-guardrails PreToolUse hook (issue #170, codex/hooks.json + codex/block-dangerous-git.sh)
#   blocks dangerous git commands. `setup.ps1 -Module codex` merges its PreToolUse entry into
#   ~/.codex/hooks.json without disturbing herdr's SessionStart entry.
# This flag lives here (not left to either integration) because this file is COPIED, not
# symlinked — so a fresh -Module codex run would otherwise drop it.
[features]
hooks = true

# Official Bicep MCP server (Azure.Bicep.McpServer), run via the .NET SDK's `dnx` tool
# runner. Buys file diagnostics, formatting, decompile, resource-type schemas, and
# best-practices lookup for .bicep files — not symbol-level go-to-definition/references,
# which stays out of scope (see .agents/specs/bicep-code-intelligence.md, Track D). Not
# registered for Claude Code: the Azure MCP plugin's `bicepschema` tool plus the
# self-authored LSP plugin already cover that ground there.
[mcp_servers.bicep]
command = "dnx"
args = ["-y", "Azure.Bicep.McpServer"]

# Per-dimension custom agents for the portable review skills (quick-review / deep-review /
# review-fix-loop / fix-findings, ai-agents/skills/). Dispatched via the `multi_agent`
# feature's `spawn_agent` tool with `agent_type: "review_<dimension>"`. See
# ai-agents/skills/deep-review/DISPATCH.md (Codex CLI section) for the dispatch shape.
#
# At the pinned codex-cli 0.147.0, an `[agents.<name>]` table only recognizes `config_file`,
# `description`, and `nickname_candidates` — per-role `sandbox_mode` / `developer_instructions`
# / `mcp_servers` keys are silently DROPPED. The read-only/write-access intent below is carried
# only in `description` (model-visible spawn guidance, not runtime-enforced); real enforcement
# is the orchestrating session's own top-level `sandbox_mode` above — which may itself be
# `workspace-write`, in which case nothing enforces a reviewer's read-only posture. See
# ai-agents/skills/deep-review/DISPATCH.md (Codex CLI section) for the full schema evidence.
[agents.review_correctness]
description = """
deep-review: correctness dimension. Read-only reviewer: apply the
`correctness` charter from ~/.codex/skills/_shared/dimensions.md and the
~/.codex/skills/_shared/review-rubric.md bar; report findings only, never edit, write,
or run commands that mutate state.
"""

[agents.review_security]
description = """
deep-review: security dimension. Read-only reviewer: apply the `security` charter from
~/.codex/skills/_shared/dimensions.md and the ~/.codex/skills/_shared/review-rubric.md
bar; read callers/config beyond the diff to confirm exploitability. Report findings
only, never edit, write, or run commands that mutate state.
"""

[agents.review_performance]
description = """
deep-review: performance dimension. Read-only reviewer: apply the `performance` charter
from ~/.codex/skills/_shared/dimensions.md and the
~/.codex/skills/_shared/review-rubric.md bar; report findings only, never edit, write,
or run commands that mutate state.
"""

[agents.review_structural]
description = """
deep-review: structural dimension. Read-only reviewer: apply the `structural` charter
from ~/.codex/skills/_shared/dimensions.md and the
~/.codex/skills/_shared/review-rubric.md bar; report findings only, never edit, write,
or run commands that mutate state.
"""

[agents.review_architecture]
description = """
deep-review: architecture dimension. Read-only reviewer: apply the `architecture`
charter from ~/.codex/skills/_shared/dimensions.md and the
~/.codex/skills/_shared/review-rubric.md bar; read beyond the diff for cross-system fit.
Report findings only, never edit, write, or run commands that mutate state.
"""

[agents.review_conventions]
description = """
deep-review: conventions dimension. Read-only reviewer: apply the
`conventions` charter from ~/.codex/skills/_shared/dimensions.md and the
~/.codex/skills/_shared/review-rubric.md bar, checking against ~/.codex/AGENTS.md.
Report findings only, never edit, write, or run commands that mutate state.
"""

[agents.review_tests]
description = """
deep-review: tests dimension. Read-only reviewer: apply the `tests`
charter from ~/.codex/skills/_shared/dimensions.md and the
~/.codex/skills/_shared/review-rubric.md bar; report findings only, never edit, write,
or run commands that mutate state.
"""

[agents.review_folded]
description = """
quick-review: folded correctness+conventions+tests reviewer. Read-only reviewer: apply
the `correctness`, `conventions`, and `tests` charters from
~/.codex/skills/_shared/dimensions.md and the ~/.codex/skills/_shared/review-rubric.md
bar, checking conventions against ~/.codex/AGENTS.md. Report findings only, never edit,
write, or run commands that mutate state.
"""

[agents.fixer]
description = """
fix-findings: applies fixes for confirmed, introduced findings (write access). Fix only
the findings assigned in your task. Lint only the files you touched before returning —
the full test suite and full-tree lint run once, after all fixers return, owned by the
orchestrator; do not run them yourself. Never write to the findings store yourself —
return your result to the orchestrator, which is the store's sole writer.
"""
