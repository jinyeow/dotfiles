# ~/.codex/config.toml — Codex CLI global config
# Installed by setup.ps1 -Module codex. Docs: https://developers.openai.com/codex/config-reference
#
# This is the STANDALONE posture (when you run `codex` directly): it can edit files in the
# workspace but asks before edits/commands. The read-only REVIEWER posture used when Claude
# Code calls Codex is set separately, as -c overrides on the MCP registration — see
# codex/README.md. Do not relax this to danger-full-access.

model = "gpt-5.6-sol"

# "minimal" | "low" | "medium" | "high"
model_reasoning_effort = "low"

# "untrusted" | "on-request" | "never"
approval_policy = "on-request"

# "read-only" | "workspace-write" | "danger-full-access"
sandbox_mode = "workspace-write"

# Personal coding conventions shared with Claude Code live in ~/.codex/AGENTS.md
# (sourced from dotfiles claude/AGENTS.md). Cap the instruction chain generously so the
# full conventions file is always read.
project_doc_max_bytes = 32768

# Enable Codex's hook system so herdr's agent-state integration can report session
# activity to a running herdr server. `setup.ps1 -Module herdr` runs `herdr integration
# install codex`, which writes the hook script + ~/.codex/hooks.json; this flag turns the
# hook system on. It lives here (not left to the integration) because this file is COPIED,
# not symlinked — so a fresh -Module codex run after herdr would otherwise drop it.
[features]
hooks = true

# Per-dimension custom agents for the portable review skills (quick-review / deep-review /
# review-fix-loop / fix-findings, ai-agents/skills/). Dispatched via the `multi_agent`
# feature's `spawn_agent` tool with `agent_type: "review_<dimension>"`. See
# ai-agents/skills/deep-review/DISPATCH.md (Codex CLI section) for the confirmed dispatch
# shape and the smoke test that verified this table is read. `mcp_servers = []` on every
# entry is a deliberate decision, not an omission: no MCP server registered in this repo
# supplies anything a reviewer needs beyond native read/grep.
[agents.review_correctness]
description = "quick-review/deep-review: correctness dimension (read-only)"
developer_instructions = """
Apply the `correctness` charter from ~/.codex/skills/_shared/dimensions.md and the bar
from ~/.codex/skills/_shared/review-rubric.md verbatim. Report findings only — never
edit, write, or run commands that mutate state.
"""
sandbox_mode = "read-only"
mcp_servers = []

[agents.review_security]
description = "deep-review: security dimension (read-only, reads beyond diff)"
developer_instructions = """
Apply the `security` charter from ~/.codex/skills/_shared/dimensions.md and the bar
from ~/.codex/skills/_shared/review-rubric.md verbatim. Read callers/config beyond the
diff to confirm exploitability. Report findings only — never edit, write, or run
commands that mutate state.
"""
sandbox_mode = "read-only"
mcp_servers = []

