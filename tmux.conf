# Hierarchy:
#  Server
#  ㄴSession
#    ㄴWindow
#      ㄴPane

# Options:
# - Session options (set-option [-g])
# - Window options (set-window-option [-g])
#
# Key bindings:
# - prefix + I         => installs new plugins
# - prefix + U         => updates plugins
# - prefix + alt + u   => removes/uninstalls plugins not on 'Plugin List'
# - prefix + Tab       => toggle sidebar with a directory tree
# - prefix + Backspace => toggle sidebar and move cursor to it (focus it)
# - prefix + r         => reloads .tmux.conf
# - Ctrl+Alt+l         => clear screen


# -------------------------------------------------------------------
# Session options {{{
# -------------------------------------------------------------------
# change bind-key to ctrl-space
#unbind C-b
#set -g prefix C-Space

# use send-prefix to pass C-a through to application
#bind C-Space send-prefix

# improve colors -> add 'alias tmux="TERM=screen-256color tmux' in .zshrc
# set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-termite:Tc"
# set -g terminal-overrides ',xterm-256color:Tc'
# set -g default-terminal "screen-256color"

# shorten command delay
set -sg escape-time 1

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1

# fastest command sequences
set -s escape-time 0

# increase scrollback lines
set -g history-limit 50000

# set status line position to top
# set-option -g status-position top

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# refresh 'status-left' and 'status-right' more often
set -g status-interval 5

# focus events enabled for terminals that support them
set -g focus-events on

# }}}
# -------------------------------------------------------------------
# Window options {{{
# -------------------------------------------------------------------
# Enable mouse
setw -g mouse on

set-window-option -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# Vi copypaste mode
set-option -g status-keys vi
set-window-option -g mode-keys vi

set-option -g allow-rename off

# }}}
# -------------------------------------------------------------------
# Decoration (256-color) {{{
# -------------------------------------------------------------------
#set -g status-bg '#0066ff'
#set -g status-fg '#aaaaaa'

# }}}
# -------------------------------------------------------------------
# Key bindings {{{
# -------------------------------------------------------------------
# switch to last pane
bind-key C-a last-pane

# moving between panes with vim movement keys
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# moving between windows with vim movement keys
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# resize panes with vim movement keys
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display-message " ✱ tmux.conf is reloaded"

# # Smart pane switching with awareness of vim splits
# is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
# bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
# bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
# bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
# bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# bind -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
#bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
#bind-key -T copy-mode-vi C-\ select-pane -l

# Reset Clear Screen <C-l> to use prefix+<C-l>
bind -n C-M-l send-keys 'C-l'

# switch windows alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

# open new pane/split-window in $pwd
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# opens new window in current directory --commented out for now
# bind-key c new-window -c "#{pane_current_path}"

# easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Copy-pasting
# bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Vim style
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
bind-key p run "xsel -o | tmux load-buffer - ; tmux paste-buffer"

# Vim style if xsel package isn't installed
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -sel clip > /dev/null"
# bind-key p run "xclip -o -sel clip | tmux load-buffer - ; tmux paste-buffer"

# }}}
# -------------------------------------------------------------------
# fzf integration {{{
# -------------------------------------------------------------------
# fzf-locate
bind-key -n M-i run "tmux split-window -p 40 'tmux send-keys -t #{pane_id} \"$(locate / | fzf -m | paste -sd\\  -)\"'"

# }}}
# -------------------------------------------------------------------
# tmux statusline/local config {{{
# -------------------------------------------------------------------
# For tmux statusline tmuxline.vim
# if-shell "test -f ./tmux_snapshot" "source-file ./tmux_snapshot"

set -g status on
set -g status-interval 1
set -g status-justify centre
set -g status-keys vi
set -g status-position bottom

set -g pane-border-style fg="colour238"
set -g pane-active-border-style fg="#61afef"

# Message/Commandline colours
set -ag message-style fg="#282c34",bg="#e5c07b"

set-window -g window-status-separator "/"

set -g status-style fg=black,bg="#93c379"

set -g status-left "#[fg=#282c34,bold] [#S] "
set -g status-left-length 20
set -g status-left-style default
# set-window-option -g status-left-fg black
set -g status-left-style bg="#93c379"
# set -g status-left-attr "none"

set -g status-right "#[fg=#282c34,bold] %H:%M %d/%m "
set -g status-right-length 100
set -g status-right-style default
# set-window-option -g status-right-style fg=black
set -g status-right-style bg="#93c379"
# set -g status-right-attr "none"

# default window title colors
set-window-option -g window-status-format "#[fg=bold] #W "
set-window-option -g window-status-style fg="black"
set-window-option -g window-status-style bg="#93c379"

# active window title colors
set-window-option -g window-status-current-format "#[fg=bold] [[#I:#W]] "
set-window-option -g window-status-current-style fg="black"
set-window-option -g window-status-current-style bg="#93c379"

# bell
set-window-option -g visual-bell on
set-window-option -g bell-action other
set-window-option -g window-status-bell-style bg="#282c34"
set-window-option -g window-status-bell-style fg="#e06c75"

# Local config
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'

# }}}
# -------------------------------------------------------------------
# Tmux Plugin Manager [tpm] {{{
# -------------------------------------------------------------------
# Automatically install tpm on if not already installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# Plugin List
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sidebar' # TODO: try this out later
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'eemed/tmux-picker'
set -g @plugin 'cfoust/tmux-fuzzywuzzy'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
#tmux-plugins/tmux-logging \
#tmux-plugins/tmux-yank \
#woodstok/tmux-butler \
#laktak/extrakto'

# Plugin Configs:
set -g @continuum-restore 'on'

# Restoring vim sessions (similarly for neovim - swap vim for nvim)
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Restoring Pane contents
set -g @resurrect-capture-pane-contents 'on'

# tmux-picker
# keybinding: Prefix + "F"
# NOTE: use clip.exe on Windows/WSL
#	default is 'DEFAULT_COMMAND="xsel --clipboard -f"'
run-shell ~/.tmux/plugins/tmux-picker/tmux-picker.tmux

# Fuzzywuzzy
# keybinding: Prefix + "Ctrl+f"
set -g @fuzzy-wuzzy "C-f"

# Fuzzback - fuzzy finder, find any tmux pane across everything
# keybinding: Prefix + "?"
run-shell '~/.tmux/plugins/tmux-fuzzback/fuzzback.tmux'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# }}}
